server.port=8083
spring.datasource.url=jdbc:mysql://localhost:3306/tracking_data?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB


worksphere.auth.bootstrap.username=${WORKSPHERE_SUPERADMIN_USERNAME:vivek.kumar@tubelightcommunications.com}
worksphere.auth.bootstrap.full-name=${WORKSPHERE_SUPERADMIN_NAME:Vivek Kumar}
worksphere.auth.bootstrap.password=${WORKSPHERE_SUPERADMIN_PASSWORD:}
worksphere.auth.bootstrap.reset-password=${WORKSPHERE_SUPERADMIN_RESET_PASSWORD:false}